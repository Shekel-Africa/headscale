# Shekel-Africa fork release config. Derived from upstream .goreleaser.yml at
# v0.29.4 with three changes only: no container images (kos removed: they push
# to ghcr.io/juanfont), release published to Shekel-Africa/headscale as a
# non-draft, non-prerelease, and changelog disabled. Keep the rest identical so
# upstream merges stay trivial. Used by .github/workflows/shekel-release.yml.
---
version: 2
before:
  hooks:
    - go mod tidy -compat=1.26
    - go mod vendor

release:
  # Shekel-Africa fork: draft until attested (shekel-release.yml publishes it
  # after actions/attest-build-provenance succeeds); never mark our -shekel.N
  # tags as prereleases.
  github:
    owner: Shekel-Africa
    name: headscale
  prerelease: false
  draft: true
  header: |
    ## Upgrade

    Please follow the steps outlined in the [upgrade guide](https://headscale.net/stable/setup/upgrade/) to update your existing Headscale installation.

builds:
  - id: headscale
    main: ./cmd/headscale
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - freebsd_amd64
      - linux_amd64
      - linux_arm64
    flags:
      - -mod=readonly

archives:
  - id: golang-cross
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    formats:
      - binary

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}"
  format: tar.gz
  files:
    - "vendor/"

nfpms:
  # Configure nFPM for .deb releases
  #
  # See https://goreleaser.com/customization/package/nfpm/
  #
  # Useful tools for debugging .debs:
  # List file contents: dpkg -c dist/headscale...deb
  # Package metadata: dpkg --info dist/headscale....deb
  #
  - ids:
      - headscale
    package_name: headscale
    priority: optional
    vendor: headscale
    maintainer: Kristoffer Dalby <kristoffer@dalby.cc>
    homepage: https://github.com/juanfont/headscale
    description: |-
      Open source implementation of the Tailscale control server.
      Headscale aims to implement a self-hosted, open source alternative to the
      Tailscale control server. Headscale's goal is to provide self-hosters and
      hobbyists with an open-source server they can use for their projects and
      labs. It implements a narrow scope, a single Tailscale network (tailnet),
      suitable for a personal use, or a small open-source organisation.
    bindir: /usr/bin
    section: net
    formats:
      - deb
    contents:
      - src: ./config-example.yaml
        dst: /etc/headscale/config.yaml
        type: config|noreplace
        file_info:
          mode: 0644
      - src: ./packaging/systemd/headscale.service
        dst: /usr/lib/systemd/system/headscale.service
      - dst: /var/lib/headscale
        type: dir
      - src: ./config-example.yaml
        dst: /usr/share/doc/headscale/examples/config-example.yaml
      - src: LICENSE
        dst: /usr/share/doc/headscale/copyright
    scripts:
      postinstall: ./packaging/deb/postinst
      postremove: ./packaging/deb/postrm
      preremove: ./packaging/deb/prerm
    deb:
      lintian_overrides:
        - no-changelog # Our CHANGELOG.md uses a different formatting
        - no-manual-page
        - statically-linked-binary

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  # No previous fork tag to diff against; upstream's CHANGELOG.md is the record.
  disable: true
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
