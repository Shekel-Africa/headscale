# Shekel-Africa fork: known-vulnerability scan of the code we ship.
#
# govulncheck reports only vulnerabilities in functions the binary actually
# calls, which complements Dependabot (module-level) and CodeQL (code patterns).
# Scheduled workflows run on the default branch, which in this fork is the
# release line we deploy (shekel/v0.29.x), not the upstream mirror main.
name: Shekel govulncheck

on:
  push:
    branches:
      - "shekel/**"
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    if: github.repository == 'Shekel-Africa/headscale'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # Same toolchain as shekel-release.yml. The action forwards
          # go-version-input (default 'stable') to setup-go, which then ignores
          # go-version-file, so it must be set explicitly.
          go-version-input: "1.26.x"
          check-latest: true
          # What the .deb ships. ./... also scans the integration harness and
          # cmd/hi (docker, runc), which never ship and would keep this red.
          go-package: ./cmd/headscale/...
          repo-checkout: false # checked out above, without persisted credentials
